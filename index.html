<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner MKF - Kreditni Upit</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; color: #0f172a; }
    .app-topbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
    .app-logo { font-weight: 800; color: #0066b2; font-size: 18px; }
    .app-container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .mkf-form-wrapper { padding: 32px; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(0, 102, 178, 0.08); }
    .mkf-header h2 { margin: 0 0 16px 0; color: #0066b2; font-size: 22px; text-align: center; }
    .mkf-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .mkf-field label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; }
    .mkf-input, .mkf-select { width: 100%; padding: 12px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; }
    .mkf-btn-submit { width: 100%; padding: 16px; background: #0066b2; color: #fff; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    .mkf-btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app-topbar">
    <div class="app-logo">PARTNER MKF</div>
  </div>

  <div class="app-container">
    <div class="mkf-form-wrapper">
      <div class="mkf-header">
        <h2>Kreditni Upit</h2>
      </div>

      <form id="mkfKreditnaForma">
        <div class="mkf-field">
          <label>Ime i Prezime / Naziv Firme *</label>
          <input type="text" id="inputKlijent" class="mkf-input" placeholder="Unesite podatke" required>
        </div>

        <div class="mkf-field">
          <label>Broj telefona *</label>
          <input type="tel" id="inputTelefon" class="mkf-input" placeholder="+387 61 123 456" required>
        </div>

        <div class="mkf-field">
          <label>Traženi Iznos (KM) *</label>
          <input type="number" id="inputIznos" class="mkf-input" placeholder="5000" required>
        </div>

        <div class="mkf-field">
          <label>Svrha / Proizvod *</label>
          <select id="selectSvrha" class="mkf-select" required>
            <option value="ESG / Energetska efikasnost">Energetska efikasnost</option>
            <option value="Obratna sredstva / Biznis">Obratna sredstva / Biznis</option>
            <option value="Poljoprivreda">Poljoprivreda</option>
          </select>
        </div>

        <button type="submit" id="btnSubmit" class="mkf-btn-submit">POŠALJI KREDITNI UPIT →</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tvoj stvarni Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDSd7z4bIMcvAywJiot_Kii4XwsNbD4U-U",
      authDomain: "mkf-partner-app.firebaseapp.com",
      projectId: "mkf-partner-app",
      storageBucket: "mkf-partner-app.firebasestorage.app",
      messagingSenderId: "340645667818",
      appId: "1:340645667818:web:f672f0869d30742ba38893"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('mkfKreditnaForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "SLANJE U TOKU...";

      try {
        await addDoc(collection(db, "leadovi"), {
          klijent: document.getElementById('inputKlijent').value,
          telefon: document.getElementById('inputTelefon').value,
          iznos: document.getElementById('inputIznos').value + " KM",
          svrha: document.getElementById('selectSvrha').value,
          datum: new Date().toLocaleString('bs-BA')
        });

        alert("Hvala vam! Vaš kreditni upit je uspješno poslan.");
        e.target.reset();
      } catch (err) {
        alert("Greška pri slanju: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "POŠALJI KREDITNI UPIT →";
      }
    });
  </script>
</body>
</html>
